<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="components.jsx"></script>
<script type="text/babel" src="views.jsx"></script>

<script type="text/babel" data-presets="env,react">
const { useState, useEffect, useMemo, useRef } = React;

const TWEAKS_DEFAULTS = /*EDITMODE-BEGIN*/{
  "lang": "zh-CN",
  "theme": "dark",
  "username": "dwgx",
  "view": "chat",
  "loggedIn": true,
  "status": "online"
}/*EDITMODE-END*/;

function loadDict(id) {
  try { return JSON.parse(document.getElementById(id).textContent); } catch (e) { return {}; }
}
const DICTS = {
  "en":    loadDict("i18n-en"),
  "zh-CN": loadDict("i18n-zh"),
  "ja-JP": loadDict("i18n-ja"),
};

function makeT(lang) {
  const dict = DICTS[lang] || DICTS["zh-CN"];
  return (key, fallback="") => {
    const parts = key.split(".");
    let v = dict;
    for (const p of parts) { v = v && v[p]; }
    if (typeof v === "string") return v;
    return fallback || key;
  };
}

const App = () => {
  const [tweaks, setTweak] = useTweaks(TWEAKS_DEFAULTS);
  const lang = tweaks.lang;
  const theme = tweaks.theme;
  const t = useMemo(() => makeT(lang), [lang]);
  const [view, setView] = useState(tweaks.view || "home");
  const [loggedIn, setLoggedIn] = useState(tweaks.loggedIn !== false);
  const [showHistory, setShowHistory] = useState(false);
  const [booting, setBooting] = useState(false);
  const status = tweaks.status || "online";
  const setStatus = (s) => setTweak({ status: s });

  // Apply theme
  useEffect(() => {
    const root = document.documentElement;
    if (theme === "system") {
      const mq = window.matchMedia("(prefers-color-scheme: light)");
      root.dataset.theme = mq.matches ? "light" : "dark";
    } else {
      root.dataset.theme = theme;
    }
  }, [theme]);

  // Lang -> CJK class on body for font fallback
  useEffect(() => {
    document.body.dataset.cjk = lang === "ja-JP" ? "ja" : (lang === "en" ? "en" : "zh");
    document.documentElement.lang = lang;
  }, [lang]);

  // Sync tweak->local view
  useEffect(() => { if (tweaks.view && tweaks.view !== view) setView(tweaks.view); }, [tweaks.view]);
  useEffect(() => { if (tweaks.loggedIn !== loggedIn) setLoggedIn(tweaks.loggedIn !== false); }, [tweaks.loggedIn]);

  const user = {
    name: tweaks.username || "dwgx",
    email: "dwgx1337@outlook.com",
    tier_key: "1week",
    expires: "2026-05-09",
    device_id_short: "f8a1c2d4...e5b6",
    last_login: "05-02 10:32",
  };

  const sessions = [
    { device: "Windows · ThinkBook", ip: "118.112.34.6",  location: "成都, 中国",  when: "05-02 10:32" },
    { device: "Windows · ThinkBook", ip: "118.112.34.6",  location: "成都, 中国",  when: "05-01 22:08" },
    { device: "Windows · Office",    ip: "203.45.67.89",  location: "北京, 中国",  when: "04-29 14:22" },
    { device: "Windows · ThinkBook", ip: "118.112.34.6",  location: "成都, 中国",  when: "04-28 09:15" },
    { device: "macOS · MBP",         ip: "192.168.1.87",  location: "本地",        when: "04-25 18:51" },
  ];

  const games = [
    { id:"cs2", name:"Counter-Strike 2", version:"1.40.1.5", tint:"#F5A524" },
  ];

  const handleNav = (id) => {
    if (id === "logout") {
      setBooting(true);
      setTimeout(() => { setLoggedIn(false); setBooting(false); setTweak({ loggedIn: false }); }, 600);
      return;
    }
    setView(id); setTweak({ view: id });
  };
  const handleSubmit = () => {
    setBooting(true);
    setTimeout(() => { setLoggedIn(true); setBooting(false); setTweak({ loggedIn: true }); }, 900);
  };

  // Render
  if (booting) return <LoadingView />;
  if (!loggedIn) return <LoginView t={t} onSubmit={handleSubmit} />;

  return (
    <div className="window">
      <Topbar title={t("app.name")} user={user} status={status} setStatus={setStatus}
              lang={lang} t={t}
              onLogout={() => handleNav("logout")}
              onShowHistory={() => setShowHistory(true)}
              onNavSettings={() => handleNav("settings")} />
      <Sidebar active={view} onNav={handleNav} t={t} />
      <main className="main">
        {view === "home"     && <HomeView user={user} status={status} lang={lang} t={t} onShowHistory={()=>setShowHistory(true)} />}
        {view === "library"  && <LibraryView items={games} t={t} />}
        {view === "chat"     && <ChatView t={t} status={status} name={user.name} />}
        {view === "cloud"    && <CloudView t={t} />}
        {view === "settings" && (
          <SettingsView t={t} lang={lang} setLang={(v)=>setTweak({lang:v})}
                        theme={theme} setTheme={(v)=>setTweak({theme:v})} />
        )}
        {showHistory && <HistoryModal sessions={sessions} t={t} onClose={()=>setShowHistory(false)} />}
      </main>

      <TweaksPanel title="Tweaks">
        <TweakSection title="View">
          <TweakSelect tweakKey="view" label="Active view"
            options={[
              {value:"home",label:"Home"},
              {value:"library",label:"Library"},
              {value:"chat",label:"Chat"},
              {value:"cloud",label:"Cloud"},
              {value:"settings",label:"Settings"},
            ]} />
          <TweakToggle tweakKey="loggedIn" label="Logged in" />
          <TweakSelect tweakKey="status" label="Status"
            options={[
              {value:"online",label:"Online"},
              {value:"busy",label:"Busy"},
              {value:"away",label:"Away"},
              {value:"sleep",label:"Sleeping"},
              {value:"offline",label:"Offline"},
            ]} />
        </TweakSection>
        <TweakSection title="Locale & theme">
          <TweakRadio tweakKey="lang" label="Language"
            options={[{value:"en",label:"EN"},{value:"zh-CN",label:"中"},{value:"ja-JP",label:"日"}]} />
          <TweakRadio tweakKey="theme" label="Theme"
            options={[{value:"dark",label:"Dark"},{value:"light",label:"Light"},{value:"system",label:"System"}]} />
        </TweakSection>
        <TweakSection title="Identity">
          <TweakText tweakKey="username" label="Username" />
        </TweakSection>
      </TweaksPanel>
    </div>
  );
};

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
